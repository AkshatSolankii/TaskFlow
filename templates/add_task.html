{% extends "base.html" %}
{% block content %}

<h2 class="section-title">Add Task</h2>

<div id="message-box"></div>

<form id="task-form"
      class="form-box">
    <label for="title" class="form-label">Title </label>
    <input type="text" id="title" class="input-box" placeholder="Enter task title">

    <label for="description" class="form-label">Description</label>
    <textarea id="description" class="input-box" rows="3" placeholder="Short description"></textarea>

    <label class="form-label">Category</label>
    <select id="category" class="input-box">
        <option value="">Uncategorized</option>
    </select>

    <div class="deadline-group">
        <label for="deadline" class="form-label">Deadline (Date & Time)</label>
        <input type="datetime-local" id="deadline" class="input-box">
    </div>

    <label for="priority" class="form-label">Priority</label>
    <select id="priority" class="input-box">
        <option>High</option>
        <option selected>Medium</option>
        <option>Low</option>
    </select>

    <section class="task-form-attachments" aria-labelledby="task-form-attachments-title">
        <h3 id="task-form-attachments-title">Attachments</h3>
        <p>Attach PDF, PNG, JPG, or DOCX files up to 10 MB each.</p>
        <input id="task-attachments" type="file" multiple
               accept=".pdf,.png,.jpg,.jpeg,.docx,application/pdf,image/png,image/jpeg,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        <div id="task-attachment-list" class="task-attachment-list" aria-live="polite"></div>
        <div id="task-selected-attachment-list" class="task-attachment-list" aria-live="polite"></div>
    </section>

    <button class="btn btn-blue full-width" type="submit">Save Task</button>
</form>

{% endblock %}
