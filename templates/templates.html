{% extends "base.html" %}
{% block content %}

<h2 class="section-title">📋 Task Templates</h2>
<p class="tpl-subtitle">Create reusable checklists, then spin up a task from one in a click.</p>

<div id="message-box"></div>

<button id="new-template-btn" class="btn btn-green" style="margin-bottom:20px;">
    + New Template
</button>

<div id="templates-list" class="templates-grid">
    <p class="muted">Loading templates…</p>
</div>

<!-- ═══════════ Create / Edit modal ═══════════ -->
<div id="template-modal" class="tpl-modal-overlay" style="display:none;">
    <div class="tpl-modal">
        <h3 id="tpl-modal-title">New Template</h3>

        <label class="tpl-label">Template Name</label>
        <input id="tpl-name-input" class="tpl-input" type="text" placeholder="e.g. Daily Standup" />

        <label class="tpl-label">Checklist Items</label>
        <div id="tpl-items-wrap"></div>
        <button id="tpl-add-item-btn" class="btn-add-item" type="button">+ Add item</button>

        <div class="tpl-modal-actions">
            <button id="tpl-cancel-btn" class="btn-cancel" type="button">Cancel</button>
            <button id="tpl-save-btn" class="btn btn-green" type="button">Save Template</button>
        </div>
        <div id="tpl-modal-msg" class="tpl-modal-msg"></div>
    </div>
</div>

<!-- ═══════════ Use-template modal ═══════════ -->
<div id="use-modal" class="tpl-modal-overlay" style="display:none;">
    <div class="tpl-modal">
        <h3>Create Task from Template</h3>

        <label class="tpl-label">Task Title</label>
        <input id="use-title-input" class="tpl-input" type="text" />

        <label class="tpl-label">Deadline (optional)</label>
        <input id="use-deadline-input" class="tpl-input" type="datetime-local" style="background-color:#0f172a" />

        <label class="tpl-label">Priority</label>
        <select id="use-priority-input" class="tpl-input">
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low">Low</option>
        </select>

        <div class="tpl-modal-actions">
            <button id="use-cancel-btn" class="btn-cancel" type="button">Cancel</button>
            <button id="use-confirm-btn" class="btn btn-green" type="button">Create Task</button>
        </div>
        <div id="use-modal-msg" class="tpl-modal-msg"></div>
    </div>
</div>

<style>
.tpl-subtitle { color: var(--muted-color, #94a3b8); font-size: 0.88rem; margin: -8px 0 20px; }

.templates-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
}

.tpl-card {
    background: var(--card-bg, #1e293b);
    border: 1px solid var(--border-color, #334155);
    border-radius: 12px;
    padding: 18px 20px;
}
.tpl-card-title {
    font-weight: 700;
    font-size: 1rem;
    color: var(--text-color, #e2e8f0);
    margin-bottom: 6px;
}
.tpl-card-count { font-size: 0.8rem; color: var(--muted-color, #94a3b8); margin-bottom: 12px; }
.tpl-card-items { list-style: none; padding: 0; margin: 0 0 16px; }
.tpl-card-items li {
    font-size: 0.85rem;
    color: var(--text-color, #cbd5e1);
    padding: 4px 0;
    display: flex;
    align-items: center;
    gap: 8px;
}
.tpl-card-items li::before { content: "☐"; color: #64748b; }

.tpl-card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tpl-card-actions button {
    border: none;
    border-radius: 7px;
    padding: 6px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
}
.btn-use    { background: #7c3aed; color: #fff; }
.btn-use:hover    { background: #6d28d9; }
.btn-edit-tpl { background: #1d4ed8; color: #fff; }
.btn-edit-tpl:hover { background: #1e40af; }
.btn-delete-tpl { background: transparent; color: #f87171; border: 1px solid #f8717155 !important; }
.btn-delete-tpl:hover { background: #7f1d1d33; }

/* modal */
.tpl-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
}
.tpl-modal {
    background: var(--card-bg, #1e293b);
    border: 1px solid var(--border-color, #334155);
    border-radius: 12px;
    padding: 24px 26px;
    width: 100%;
    max-width: 440px;
    max-height: 85vh;
    overflow-y: auto;
}
.tpl-modal h3 { margin: 0 0 16px; color: var(--text-color, #e2e8f0); }
.tpl-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted-color, #94a3b8);
    margin: 14px 0 6px;
}
.tpl-input {
    width: 100%;
    background-color: var(--input-bg, #0f172a);
    border: 1px solid var(--border-color, #334155);
    border-radius: 7px;
    color: var(--text-color, #e2e8f0);
    padding: 8px 12px;
    font-size: 0.88rem;
    outline: none;
    box-sizing: border-box;
}
.tpl-input:focus { border-color: #7c3aed; }

.tpl-item-row { display: flex; gap: 8px; margin-bottom: 8px; }
.tpl-item-row input { flex: 1; }
.tpl-item-remove {
    background: none; border: none; color: #f87171;
    cursor: pointer; font-size: 1rem; padding: 0 6px;
}
.btn-add-item {
    background: none;
    border: 1px dashed var(--border-color, #334155);
    color: var(--muted-color, #94a3b8);
    border-radius: 7px;
    padding: 6px 14px;
    font-size: 0.82rem;
    cursor: pointer;
    width: 100%;
    margin-top: 4px;
}
.btn-add-item:hover { border-color: #7c3aed; color: #a78bfa; }

.tpl-modal-actions {
    display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;
}
.btn-cancel {
    background: none;
    border: 1px solid var(--border-color, #334155);
    color: var(--muted-color, #94a3b8);
    border-radius: 7px;
    padding: 7px 16px;
    font-size: 0.85rem;
    cursor: pointer;
}
.tpl-modal-msg { margin-top: 10px; font-size: 0.82rem; min-height: 16px; }
.tpl-modal-msg.err { color: #f87171; }
.tpl-modal-msg.ok  { color: #4ade80; }

.no-templates {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    color: var(--muted-color, #94a3b8);
}
</style>

<script src="/static/templates.js"></script>
{% endblock %}
