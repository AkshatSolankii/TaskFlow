{% extends "base.html" %}
{% block content %}

<h2>Task Manager</h2>

<div class="category-box">
    <input
        type="text"
        id="category-name"
        class="input-box"
        placeholder="Add category (e.g. Work, Study)"
    >
    <button class="btn btn-blue" onclick="addCategory()">Add Category</button>
</div>

<div class="task-manager-header">
    <input
        id="task-search"
        placeholder="Filter tasks..."
        class="search-box"
    >

    <select id="category-filter" class="dropdown">
        <option value="all">All Categories</option>
    </select>
</div>

<div id="message-box"></div>

<!-- ✅ TASK LIST -->
<div id="manager-list" class="task-manager-list"></div>

<!-- ✅ PAGINATION (ADD THIS) -->
<div id="pagination" style="margin-top:20px;"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        loadCategories();
        loadTasks(1); // ✅ start from page 1
    });

    // 🔥 IMPORTANT: reload pagination on filter/search
    document.getElementById("task-search")?.addEventListener("input", () => {
        loadTasks(1);
    });

    document.getElementById("category-filter")?.addEventListener("change", () => {
        loadTasks(1);
    });
</script>

{% endblock %}
