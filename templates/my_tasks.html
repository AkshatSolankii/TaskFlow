{% extends "base.html" %}
{% block content %}

<h2 class="section-title">My Tasks</h2>

<div id="message-box"></div>

<!-- SORTING -->
<div class="sort-container">
    <label>Sort By:</label>
    <select onchange="changeSort(this.value)" class="sort-dropdown">
        <option value="created">Created</option>
        <option value="deadline">Deadline</option>
        <option value="priority">Priority</option>
    </select>
</div>

<!-- OWN TASKS -->
<div id="manager-list" class="task-list"></div>

<!-- PAGINATION -->
<div id="pagination" style="margin-top:20px;"></div>

<!-- ═══════════════════════════════════════════
     SHARED WITH ME
════════════════════════════════════════════ -->
<div id="shared-section" style="display:none; margin-top:40px;">

    <div class="shared-header">
        <h3 class="shared-title">👥 Shared with Me</h3>
        <span class="shared-subtitle">Tasks other users have invited you to collaborate on</span>
    </div>

    <div id="shared-tasks-list"></div>

</div>

<style>
/* ── shared section header ── */
.shared-header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border-color, #334155);
}
.shared-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0;
    color: var(--text-color, #000000);
}
.shared-subtitle {
    font-size: 0.82rem;
    color: var(--muted-color, #94a3b8);
}

/* ── shared task card ── */
.shared-task-card {
    background: var(--card-bg, #1e293b);
    border: 1px solid var(--border-color, #334155);
    border-left: 4px solid #7c3aed;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    transition: border-color .2s;
}
.shared-task-card:hover { border-left-color: #a78bfa; }

.shared-task-info { flex: 1; min-width: 200px; }

.shared-task-title {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text-color, #e2e8f0);
    margin-bottom: 5px;
}

.shared-task-meta {
    font-size: 0.8rem;
    color: var(--muted-color, #94a3b8);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
}

/* role badge */
.role-badge {
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
}
.role-editor { background: #3b2a05; color: #fbbf24; border: 1px solid #d9770644; }
.role-viewer { background: #1a2a1a; color: #86efac; border: 1px solid #16a34a44; }

/* priority badge (reuse existing classes if present) */
.shared-priority {
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
}
.pri-high   { background:#7f1d1d33; color:#f87171; }
.pri-medium { background:#78350f33; color:#fbbf24; }
.pri-low    { background:#14532d33; color:#86efac; }

/* status */
.shared-status {
    text-transform: capitalize;
    font-size: 0.78rem;
    color: var(--muted-color, #94a3b8);
}

/* action buttons */
.shared-task-actions { display: flex; gap: 8px; align-items: center; }

.btn-open-task {
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 7px 16px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background .2s;
}
.btn-open-task:hover { background: #6d28d9; }

.btn-edit-shared {
    background: #1d4ed8;
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 7px 16px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background .2s;
}
.btn-edit-shared:hover { background: #1e40af; }

.no-shared {
    text-align: center;
    padding: 30px;
    color: var(--muted-color, #94a3b8);
    font-size: 0.88rem;
}
</style>

{% endblock %}
