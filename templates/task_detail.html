{% extends "base.html" %}
{% block content %}

<div id="task-detail-root">

    <!-- ── HEADER ─────────────────────────────────── -->
    <div class="td-header">
        <button class="btn-back" onclick="history.back()">← Back</button>
        <div class="td-title-row">
            <h2 id="td-title" class="td-title">Loading…</h2>
            <span id="td-status-badge" class="td-status-badge"></span>
        </div>
        <div id="td-meta" class="td-meta"></div>
    </div>

    <!-- ═══════════════ CHECKLIST (from template, if any) ═══════════════ -->
    <div id="checklist-section" style="display:none; margin: 20px 0; ">
        <h4 class="checklist-title" >✅ Checklist</h4>
        <div id="checklist-items"></div>
    </div>

    <section class="attachments-section" aria-labelledby="attachments-title">
        <div class="attachments-heading">
            <div>
                <h4 id="attachments-title">Attachments</h4>
                <p>Files attached to this task.</p>
            </div>
        </div>
        <div id="attachments-list" class="attachments-list"><p class="td-muted">Loading attachments…</p></div>
    </section>

    <!-- ── TABS ──────────────────────────────────── -->
    <div class="td-tabs">
        <button class="td-tab active" data-tab="comments">💬 Comments</button>
        <button class="td-tab"        data-tab="members">👥 Members</button>
    </div>

    <!-- ═══════════════ QUICK EDIT PANEL (Editors only) ═══════════════ -->
    <div id="editor-panel" style="display:none; margin-bottom:20px;">
        <div class="editor-panel-box">
            <h4 class="editor-panel-title">✏️ Quick Edit</h4>
            <div class="editor-fields">
                <div class="editor-field">
                    <label class="editor-label">Status</label>
                    <select id="edit-status" class="editor-select">
                        <option value="pending">Pending</option>
                        <option value="in_progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="editor-field">
                    <label class="editor-label">Priority</label>
                    <select id="edit-priority" class="editor-select">
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <div class="editor-field" style="flex:2">
                    <label class="editor-label">Title</label>
                    <input id="edit-title" class="editor-input" type="text" placeholder="Task title" />
                </div>
            </div>
            <div class="editor-field" style="margin-top:10px;">
                <label class="editor-label">Description</label>
                <textarea id="edit-description" class="editor-textarea" rows="3"
                          placeholder="Task description"></textarea>
            </div>
            <div style="margin-top:12px; display:flex; gap:10px; align-items:center;">
                <button class="btn-save-edit" id="save-edit-btn">💾 Save Changes</button>
                <span id="edit-msg" style="font-size:.82rem;"></span>
            </div>
        </div>
    </div>

    <!-- ═══════════════ COMMENTS TAB ═══════════════ -->
    <div id="tab-comments" class="td-tab-panel active">

        <div id="comments-list" class="comments-list">
            <p class="td-muted">Loading comments…</p>
        </div>

        <!-- Comment input -->
        <div class="comment-form">
            <div class="comment-avatar self-avatar" id="self-avatar">?</div>
            <div class="comment-input-wrap">
                <textarea
                    id="comment-input"
                    class="comment-textarea"
                    placeholder="Add a comment…"
                    rows="3"
                    maxlength="2000"
                ></textarea>
                <div class="comment-form-footer">
                    <span class="char-count" id="char-count">0 / 2000</span>
                    <button class="btn-post" id="post-comment-btn">Post Comment</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ═══════════════ MEMBERS TAB ═══════════════ -->
    <div id="tab-members" class="td-tab-panel">

        <div id="members-list" class="members-list">
            <p class="td-muted">Loading members…</p>
        </div>

        <!-- Invite form (only visible to owner) -->
        <div id="invite-form" class="invite-form" style="display:none;">
            <h4 class="invite-title">Invite a Member</h4>
            <div class="invite-row">
                <input
                    id="invite-username"
                    class="invite-input"
                    placeholder="Username"
                    type="text"
                />
                <select id="invite-role" class="invite-select">
                    <option value="Editor">Editor</option>
                    <option value="Viewer">Viewer</option>
                </select>
                <button class="btn-invite" id="invite-btn">Send Invite</button>
            </div>
            <div id="invite-msg" class="invite-msg"></div>

            <!-- Sent invitations list -->
            <div id="sent-invitations-wrap" style="margin-top:20px;">
                <h4 class="invite-title" style="margin-bottom:10px;">Sent Invitations</h4>
                <div id="sent-invitations-list">
                    <p class="td-muted">Loading…</p>
                </div>
            </div>
        </div>

    </div>

</div><!-- /#task-detail-root -->


<style>
/* ═══════════════════════════════════════════
   LAYOUT
════════════════════════════════════════════ */
#task-detail-root {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 0 60px;
}

/* ── header ── */
.td-header    { margin-bottom: 24px; }
.btn-back {
    background: none;
    border: 1px solid var(--border-color, #334155);
    color: var(--muted-color, #94a3b8);
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    margin-bottom: 14px;
    transition: background .2s;
}
.btn-back:hover { background: var(--border-color, #334155); }

.td-title-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}
.td-title {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-color, #000000);
    margin: 0;
}
.td-status-badge {
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;

}
.badge-pending    { background:#1e3a5f; color:#60a5fa; border:1px solid #2563eb55; }
.badge-in_progress{ background:#3b2a05; color:#fbbf24; border:1px solid #d9770655; }
.badge-completed  { background:#0f2e1a; color:#4ade80; border:1px solid #16a34a55; }

.td-meta {

/* ── tabs ── */

.td-tab:hover  { color: var(--text-color, #e2e8f0); }

/* ═══════════════════════════════════════════
   CHECKLIST
════════════════════════════════════════════ */
.checklist-title {

/* ═══════════════════════════════════════════

════════════════════════════════════════════ */
.comments-list {

.comment-input-wrap { flex: 1; }

.btn-remove-member {

    padding: 3px 10px;
    font-size: 0.75rem;

}
.invite-row {

    gap: 10px;
    flex-wrap: wrap;
}
.invite-input {

.invite-select {

/* ── editor quick-edit panel ── */
.editor-panel-box {
    background: var(--card-bg, #1e293b);
    border: 1px solid #7c3aed55;
    border-left: 4px solid #7c3aed;
    border-radius: 10px;
    padding: 18px 20px;
}
.editor-panel-title {
    margin: 0 0 14px;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-color, #e2e8f0);
}
.editor-fields {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}
.editor-field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }
.editor-label { font-size: 0.75rem; color: var(--muted-color, #94a3b8); font-weight: 600; }
.editor-select,

.btn-save-edit {
    background: #7c3aed;

    border: none;
    border-radius: 7px;
    padding: 8px 20px;
    font-size: 0.85rem;
    font-weight: 600;

}
.btn-save-edit:hover    { background: #6d28d9; }

/* sent invitations table */
.sent-inv-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border-color, #334155);
    margin-bottom: 8px;
    font-size: 0.83rem;
    flex-wrap: wrap;

}
.inv-status-pill {
    padding: 2px 10px;
    border-radius: 20px;

<script>
// ── state — injected by Flask, no extra API call needed ──
const TASK_ID        = {{ task_id }};
const CURRENT_USER_ID = {{ current_user_id }};
let   IS_OWNER        = false;

// ── boot ──────────────────────────────────────
document.addEventListener("DOMContentLoaded", async () => {
    // Set avatar initial from server-rendered username
    document.getElementById("self-avatar").textContent =
        {{ current_username | tojson }}[0].toUpperCase();
    await loadTaskHeader();
    await loadAttachments();
    await loadComments();
    await loadChecklist();
    await loadMembers();
    wireUI();
    // Sent invitations loaded after IS_OWNER is set inside loadMembers
    if (IS_OWNER) await loadSentInvitations();
});

// ─────────────────────────────────────────────
// Task header
// ─────────────────────────────────────────────
async function loadTaskHeader() {
    try {
        // Uses the dedicated single-task endpoint, which checks
        // can_access_task — works for Owner, Editor, and Viewer alike.
        const res = await fetch(`/api/tasks/${TASK_ID}`, { credentials: "include" });

        if (res.status === 403) {
            document.getElementById("td-title").textContent = "Access denied";
            document.getElementById("td-meta").innerHTML =
                `<span style="color:#f87171">You don't have access to this task.</span>`;
            return;
        }

        if (!res.ok) {
            document.getElementById("td-title").textContent = "Task not found";
            return;
        }

        const task = await res.json();

        document.getElementById("td-title").textContent = task.title;

        const badge = document.getElementById("td-status-badge");
        badge.textContent = task.status.replace("_", " ");
        badge.className   = `td-status-badge badge-${task.status}`;

        document.getElementById("td-meta").innerHTML = `
            <span style="color:black">📅 Due: ${task.deadline
                ? new Date(task.deadline).toLocaleDateString("en-IN",
                    { dateStyle: "medium" })
                : "No deadline"}</span>
            <span style="color:black">🔥 Priority: ${task.priority}</span>
            <span style="color:black">🗂 Category: ${task.category || "Uncategorized"}</span>
            ${task.your_role && task.your_role !== "Owner"
                ? `<span>👤 Owner: ${escHtml(task.owner_username)}</span>`
                : ""}
        `;

        // Store task data globally for the editor panel
        window._TASK_DATA = task;

    } catch (e) {
        console.error("loadTaskHeader:", e);
    }
}

// Attachments
function formatFileSize(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

function attachmentType(name) {
    const match = String(name).match(/\.([a-z0-9]+)$/i);
    return match ? match[1].toUpperCase() : "FILE";
}

async function loadAttachments() {
    const list = document.getElementById("attachments-list");
    try {
        const response = await fetch(`/api/tasks/${TASK_ID}/attachments`, { credentials: "include" });
        if (!response.ok) throw new Error("Unable to load attachments");
        const attachments = await response.json();
        if (!attachments.length) {
            list.innerHTML = '<p class="td-muted">No files attached yet.</p>';
            return;
        }
        list.innerHTML = attachments.map(attachment => {
            return `<div class="attachment-row" id="attachment-${attachment.id}">
                <span class="attachment-file-type">${attachmentType(attachment.name)}</span>
                <span class="attachment-name">${escHtml(attachment.name)}</span>
                <span class="attachment-size">${formatFileSize(attachment.size)}</span>
                <a class="attachment-download" href="/api/tasks/${TASK_ID}/attachments/${attachment.id}/download">Download</a>
            </div>`;
        }).join("");
    } catch (error) {
        list.innerHTML = '<p class="td-muted">Failed to load attachments.</p>';
    }
}

// ─────────────────────────────────────────────
// Comments
// ─────────────────────────────────────────────
async function loadComments() {
    const list = document.getElementById("comments-list");
    try {
        const res  = await fetch(`/api/tasks/${TASK_ID}/comments`,
            { credentials: "include" });

        if (res.status === 403) {
            list.innerHTML = `<p class="td-muted" style="color:#f87171">
                You don't have access to this task.</p>`;
            return;
        }

        const comments = await res.json();

        if (!comments.length) {
            list.innerHTML = `<div class="no-comments">
                💬 No comments yet. Be the first!</div>`;
            return;
        }

        list.innerHTML = comments.map(c => buildCommentHTML(c)).join("");

    } catch (e) {
        list.innerHTML = `<p class="td-muted">Failed to load comments.</p>`;
        console.error(e);
    }
}

function buildCommentHTML(c) {
    const canDelete = (c.user_id === CURRENT_USER_ID || IS_OWNER);
    const deleteBtn = canDelete
        ? `<button class="comment-delete"
                onclick="deleteComment(${c.id})"
                title="Delete comment">✕</button>`
        : "";

    return `
        <div class="comment-item" id="comment-${c.id}">
            <div class="comment-avatar">${escHtml(c.avatar)}</div>
            <div class="comment-bubble">
                <div class="comment-bubble-header">
                    <span class="comment-author">${escHtml(c.username)}</span>
                    <span class="comment-time">${escHtml(c.created_at)}</span>
                    ${deleteBtn}
                </div>
                <div class="comment-text">${escHtml(c.content)}</div>
            </div>
        </div>`;
}

async function postComment() {
    const input   = document.getElementById("comment-input");
    const btn     = document.getElementById("post-comment-btn");
    const content = input.value.trim();

    if (!content) return;

    btn.disabled = true;
    btn.textContent = "Posting…";

    try {
        const res  = await fetch(`/api/tasks/${TASK_ID}/comments`, {
            method:      "POST",
            credentials: "include",
            headers:     { "Content-Type": "application/json" },
            body:        JSON.stringify({ content })
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.error || "Failed to post comment");
            return;
        }

        input.value = "";
        document.getElementById("char-count").textContent = "0 / 2000";

        // Append new comment without full reload
        const list = document.getElementById("comments-list");
        const noMsg = list.querySelector(".no-comments");
        if (noMsg) noMsg.remove();

        list.insertAdjacentHTML("beforeend", buildCommentHTML(data));
        list.lastElementChild.scrollIntoView({ behavior: "smooth" });

    } catch (e) {
        alert("Network error");
        console.error(e);
    } finally {
        btn.disabled    = false;
        btn.textContent = "Post Comment";
    }
}

async function deleteComment(commentId) {
    if (!confirm("Delete this comment?")) return;

    const res = await fetch(
        `/api/tasks/${TASK_ID}/comments/${commentId}`,
        { method: "DELETE", credentials: "include" }
    );

    if (res.ok) {
        document.getElementById(`comment-${commentId}`)?.remove();
        const list = document.getElementById("comments-list");
        if (!list.children.length) {
            list.innerHTML = `<div class="no-comments">
                💬 No comments yet. Be the first!</div>`;
        }
    } else {
        alert("Failed to delete comment");
    }
}

// ─────────────────────────────────────────────
// Checklist (from template, if any)
// ─────────────────────────────────────────────
async function loadChecklist() {
    const section = document.getElementById("checklist-section");
    const wrap    = document.getElementById("checklist-items");
    if (!section || !wrap) return;

    try {
        const res = await fetch(`/api/tasks/${TASK_ID}/checklist`, { credentials: "include" });
        if (!res.ok) return; // no access or endpoint issue — just skip silently

        const items = await res.json();
        if (!items.length) { section.style.display = "none"; return; }

        section.style.display = "block";
        wrap.innerHTML = items.map(i => `
            <div class="checklist-row ${i.is_done ? 'done' : ''}" id="chk-${i.id}">
                <input type="checkbox" ${i.is_done ? "checked" : ""}
                       onchange="toggleChecklistItem(${i.id}, this.checked)" />
                <span style="color:#0f172a">${escHtml(i.text)}</span>
            </div>
        `).join("");
    } catch (e) {
        console.error("loadChecklist:", e);
    }
}

async function toggleChecklistItem(itemId, isDone) {
    const row = document.getElementById(`chk-${itemId}`);
    try {
        const res = await fetch(`/api/tasks/${TASK_ID}/checklist/${itemId}`, {
            method: "PATCH", credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ is_done: isDone })
        });
        if (!res.ok) {
            const data = await res.json();
            alert(data.error || "Failed to update item");
            row.querySelector("input").checked = !isDone; // revert
            return;
        }
        row.classList.toggle("done", isDone);
    } catch (e) {
        row.querySelector("input").checked = !isDone;
        alert("Network error");
    }
}

// ─────────────────────────────────────────────
// Members
// ─────────────────────────────────────────────
async function loadMembers() {
    const list = document.getElementById("members-list");
    try {
        const res     = await fetch(`/api/tasks/${TASK_ID}/members`,
            { credentials: "include" });

        if (!res.ok) {
            list.innerHTML = `<p class="td-muted">Could not load members.</p>`;
            return;
        }

        const members = await res.json();

        // Check if current user is the owner
        const ownerEntry = members.find(m => m.role === "Owner");
        IS_OWNER = ownerEntry && ownerEntry.user_id === CURRENT_USER_ID;

        if (IS_OWNER) {
            document.getElementById("invite-form").style.display = "block";
        }

        // Check if current user is an Editor on this task
        const myMembership = members.find(
            m => m.user_id === CURRENT_USER_ID && m.role === "Editor"
        );
        if (myMembership) {
            showEditorPanel("Editor");
        }

        list.innerHTML = members.map(m => `
            <div class="member-row" id="member-row-${m.id ?? 'owner'}">
                <div class="member-avatar">${m.username[0].toUpperCase()}</div>
                <span class="member-name">${escHtml(m.username)}</span>
                <span class="member-role role-${m.role.toLowerCase()}">${m.role}</span>
                ${IS_OWNER && m.id
                    ? `<button class="btn-remove-member"
                            onclick="removeMember(${m.id})">Remove</button>`
                    : ""}
            </div>`
        ).join("");

    } catch (e) {
        list.innerHTML = `<p class="td-muted">Failed to load members.</p>`;
        console.error(e);
    }
}

async function inviteMember() {
    const username = document.getElementById("invite-username").value.trim();
    const role     = document.getElementById("invite-role").value;
    const msgEl    = document.getElementById("invite-msg");

    if (!username) {
        msgEl.className = "invite-msg err";
        msgEl.textContent = "Please enter a username.";
        return;
    }

    const res  = await fetch(`/api/tasks/${TASK_ID}/invite`, {
        method:      "POST",
        credentials: "include",
        headers:     { "Content-Type": "application/json" },
        body:        JSON.stringify({ username, role })
    });

    const data = await res.json();

    if (res.ok) {
        msgEl.className   = "invite-msg ok";
        msgEl.textContent = `✓ Invitation sent to ${username} — they will see it in their Notifications.`;
        document.getElementById("invite-username").value = "";
        // Reload the sent invitations list
        await loadSentInvitations();
    } else {
        msgEl.className   = "invite-msg err";
        msgEl.textContent = data.error || "Failed to invite";
    }
}

async function removeMember(memberId) {
    if (!confirm("Remove this member?")) return;

    const res = await fetch(
        `/api/tasks/${TASK_ID}/members/${memberId}`,
        { method: "DELETE", credentials: "include" }
    );

    if (res.ok) {
        await loadMembers();
    } else {
        alert("Failed to remove member");
    }
}

// ─────────────────────────────────────────────
// Editor panel — show for Editors, hide for Viewers/Owners
// ─────────────────────────────────────────────
function showEditorPanel(role) {
    const panel = document.getElementById("editor-panel");
    if (!panel) return;

    // Show panel for Editors only (Owner uses full edit page)
    if (role !== "Editor") return;

    panel.style.display = "block";

    // Populate fields once task data is loaded
    const waitForTask = setInterval(() => {
        const task = window._TASK_DATA;
        if (!task) return;
        clearInterval(waitForTask);

        const titleEl = document.getElementById("edit-title");
        const descEl  = document.getElementById("edit-description");
        const statEl  = document.getElementById("edit-status");
        const priEl   = document.getElementById("edit-priority");

        if (titleEl) titleEl.value = task.title       || "";
        if (descEl)  descEl.value  = task.description || "";
        if (statEl)  statEl.value  = task.status      || "pending";
        if (priEl)   priEl.value   = task.priority    || "Medium";
    }, 100);
}

async function saveEdits() {
    const btn  = document.getElementById("save-edit-btn");
    const msg  = document.getElementById("edit-msg");
    const body = {
        title:       document.getElementById("edit-title")?.value.trim(),
        description: document.getElementById("edit-description")?.value.trim(),
        status:      document.getElementById("edit-status")?.value,
        priority:    document.getElementById("edit-priority")?.value,
    };

    if (!body.title) {
        msg.style.color = "#f87171";
        msg.textContent = "Title cannot be empty.";
        return;
    }

    btn.disabled    = true;
    btn.textContent = "Saving…";

    try {
        const res  = await fetch(`/api/tasks/${TASK_ID}`, {
            method:      "PATCH",
            credentials: "include",
            headers:     { "Content-Type": "application/json" },
            body:        JSON.stringify(body)
        });
        const data = await res.json();

        if (res.ok) {
            msg.style.color = "#4ade80";
            msg.textContent = "✓ Saved successfully!";
            window._TASK_DATA = { ...window._TASK_DATA, ...body };
            // Refresh the header
            document.getElementById("td-title").textContent = body.title;
            const badge = document.getElementById("td-status-badge");
            badge.textContent = body.status.replace("_", " ");
            badge.className   = `td-status-badge badge-${body.status}`;
            setTimeout(() => { msg.textContent = ""; }, 3000);
        } else {
            msg.style.color = "#f87171";
            msg.textContent = data.error || "Failed to save.";
        }
    } catch (e) {
        msg.style.color = "#f87171";
        msg.textContent = "Network error.";
    } finally {
        btn.disabled    = false;
        btn.textContent = "💾 Save Changes";
    }
}

// ─────────────────────────────────────────────
// Sent invitations (owner only) — backend now excludes
// accepted invites, so this list only ever shows
// pending / rejected.
// ─────────────────────────────────────────────
async function loadSentInvitations() {
    const list = document.getElementById("sent-invitations-list");
    if (!list) return;

    try {
        const res  = await fetch(`/api/tasks/${TASK_ID}/invitations`,
            { credentials: "include" });
        if (!res.ok) { list.innerHTML = ""; return; }

        const invitations = await res.json();

        if (!invitations.length) {
            list.innerHTML = `<p class="td-muted">No pending or rejected invitations.</p>`;
            return;
        }

        list.innerHTML = invitations.map(inv => {
            const pillClass = {
                pending:  "pill-pending",
                rejected: "pill-rejected"
            }[inv.status] || "pill-pending";

            return `
                <div class="sent-inv-row">
                    <span><strong>${escHtml(inv.invitee_username)}</strong>
                          &nbsp;·&nbsp; ${escHtml(inv.role)}</span>
                    <span style="display:flex;align-items:center;gap:10px;">
                        <span class="inv-status-pill ${pillClass}">
                            ${inv.status.charAt(0).toUpperCase() + inv.status.slice(1)}
                        </span>
                        <span style="color:#94a3b8;font-size:.75rem">${escHtml(inv.created_at)}</span>
                    </span>
                </div>`;
        }).join("");

    } catch (e) {
        console.error("loadSentInvitations:", e);
    }
}

// ─────────────────────────────────────────────
// UI wiring
// ─────────────────────────────────────────────
function wireUI() {
    // Tab switching
    document.querySelectorAll(".td-tab").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".td-tab").forEach(b => b.classList.remove("active"));
            document.querySelectorAll(".td-tab-panel").forEach(p => p.classList.remove("active"));
            btn.classList.add("active");
            document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
        });
    });

    // Post comment button
    document.getElementById("post-comment-btn")
        .addEventListener("click", postComment);

    // Ctrl+Enter to post
    document.getElementById("comment-input")
        .addEventListener("keydown", e => {
            if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) postComment();
        });

    // Char counter
    document.getElementById("comment-input")
        .addEventListener("input", e => {
            document.getElementById("char-count").textContent =
                `${e.target.value.length} / 2000`;
        });

    // Invite button
    document.getElementById("invite-btn")
        ?.addEventListener("click", inviteMember);

    // Editor save button
    document.getElementById("save-edit-btn")
        ?.addEventListener("click", saveEdits);

    // Auto-open tab if ?tab=edit in URL
    const urlTab = new URLSearchParams(window.location.search).get("tab");
    if (urlTab === "edit") {
        const membersTab = document.querySelector('[data-tab="members"]');
        if (membersTab) membersTab.click();
    }
}

// ─────────────────────────────────────────────
// Utility
// ─────────────────────────────────────────────
function escHtml(str) {
    if (!str) return "";
    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
</script>
