{% extends "base.html" %}

{% block content %}

<div class="top-bar">

    <div class="top-left">

        <button id="open-add"
                class="btn btn-green">

            + Add New Task
        </button>

    </div>

    <!-- 🔥 AUTH BUTTONS -->
    <div class="auth-buttons">

        {% if current_user.is_authenticated %}

            <button onclick="logoutUser()"
                    class="btn btn-red">

                Logout
            </button>

        {% else %}

            <a href="/login"
               class="btn btn-blue">

                Login
            </a>

            <a href="/register"
               class="btn btn-purple">

                Register
            </a>

        {% endif %}

    </div>

</div>

<!-- 🔥 FILTER -->
<div class="top-bar">

    <select id="view-filter"
            class="dropdown">

        <option value="all">
            All Tasks
        </option>

        <option value="today">
            Today
        </option>

        <option value="week">
            This Week
        </option>

        <option value="overdue">
            Overdue
        </option>

        <option value="pending">
            Pending
        </option>

        <option value="completed">
            Completed
        </option>

    </select>

</div>

<h2 class="section-title">
    Dashboard Overview
</h2>

<div id="message-box"></div>

<!-- 🔥 TASK CARDS -->
<div id="dashboard-cards"
     class="cards-grid"></div>

{% endblock %}
