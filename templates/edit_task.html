{% extends "base.html" %}
{% block content %}

<h2 class="section-title">Edit Task</h2>

<div id="message-box"></div>

<form class="form-box" onsubmit="updateTask(event, {{ task.id }})">
    <label for="title">Title *</label>
    <input type="text" id="title" class="input-box" value="{{ task.title }}">

    <label for="description">Description</label>
    <textarea id="description" class="input-box" rows="3">{{ task.description }}</textarea>

    <label for="deadline">Deadline *</label>
    <input type="date" id="deadline" class="input-box" value="{{ task.deadline }}">

    <label for="priority">Priority</label>
    <select id="priority" class="input-box">
        <option {% if task.priority == 'High' %}selected{% endif %}>High</option>
        <option {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
        <option {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
    </select>

    <label for="status">Status</label>
    <select id="status" class="input-box">
        <option value="pending" {% if task.status == 'pending' %}selected{% endif %}>Pending</option>
        <option value="completed" {% if task.status == 'completed' %}selected{% endif %}>Completed</option>
    </select>

    <button class="btn btn-blue full-width" type="submit">Update Task</button>
</form>
<script src="/static/js/utils.js"></script>
{% endblock %}
