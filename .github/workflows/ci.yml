name: Build and Test

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m compileall .

      - name: Import check
        run: |
          python -c "import app"

      - name: Run tests
        run: |
          pytest